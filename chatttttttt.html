<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #chat-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    height: 400px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    display: none;
}

#chat-toggler {
    position: fixed;
    bottom: 20px;
    right: 20px;
}
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-4">
    <!-- اختيار الحدث -->
    <div class="dropdown mb-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            🎉 Choose an Event
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">🎂 Birthday</a></li>
            <li><a class="dropdown-item" href="#">💍 Wedding</a></li>
            <li><a class="dropdown-item" href="#">🎓 Graduation</a></li>
            <li><a class="dropdown-item" href="#">🎄 Holiday</a></li>
        </ul>
    </div>

    <!-- اختيار نوع المنتج -->
    <div class="dropdown mb-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            🛍️ Choose a Product Type
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">🎈 Balloons</a></li>
            <li><a class="dropdown-item" href="#">🕯️ Candles</a></li>
            <li><a class="dropdown-item" href="#">🍽️ Tableware</a></li>
            <li><a class="dropdown-item" href="#">🎀 Decorations</a></li>
        </ul>
    </div>

    <!-- اختيار لون الديكور -->
    <div class="dropdown mb-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            🎨 Choose a Color Theme
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">🔴 Red</a></li>
            <li><a class="dropdown-item" href="#">🔵 Blue</a></li>
            <li><a class="dropdown-item" href="#">🟢 Green</a></li>
            <li><a class="dropdown-item" href="#">⚫ Black</a></li>
            <li><a class="dropdown-item" href="#">⚪ White</a></li>
        </ul>
    </div>
</div>
<button id="chat-toggler" class="btn btn-primary">open chat</button>
<div id="chat-container" style="display: none;"></div>

    <script>
  document.getElementById("chat-toggler").addEventListener("click", function() {
      let chat = document.getElementById("chat-container");
      chat.style.display = chat.style.display === "none" ? "block" : "none";
  });
</script>
</body>
</html>
