<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/sign.css">
     <script src="https://kit.fontawesome.com/9e5ba2e3f5.js" crossorigin="anonymous"></script>
<script type="module" src="fire.js" defer></script>
   <script src="sign.js" defer></script>

    <title>Signin & Sign up</title>
</head>

<body>
   <div class="social-icons">
    <a href="#"><img src="images/google.png" alt="Google"></a>    
    <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
    <a href="#"><img src="images/instagram login.png" alt="GitHub"></a>
    <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
</div>

    <div class="wrapper">
        <div class="form-container sign-up">
    <form method="post" action="#">
        <div id="signUpMessage" class="messageDiv" style="display: none;"></div>
        <h2>Sign Up</h2>

        <div class="form-group">
            <input type="text" id="username" required>
            <i class="fas fa-user"></i>
            <label for="signup-username">Username</label>
        </div>

        <div class="form-group">
            <input type="email" id="email" required>
            <i class="fas fa-at"></i>
            <label for="signup-email">Email</label>
        </div>

        <div class="form-group">
            <input type="password" id="pass" required>
            <i class="fas fa-lock"></i>
            <label for="signup-password">Password</label>
        </div>

        <div class="form-group">
            <input type="password" id="confirm-pass" required>
            <i class="fas fa-lock"></i>
            <label for="signup-confirm-password">Confirm Password</label>
        </div>

        <button type="submit" class="btn" id="signup-submit">Sign Up</button>

        <div class="link">
            <p>You already have an account? <a href="#" class="signin-link">Sign In</a></p>
        </div>
    </form>
</div>

<div class="form-container sign-in">
    <form method="post" action="#">
   <div id="signInMessage" class="messageDiv" style="display: none;"></div>

        <h2>Login</h2>

        <div class="form-group">
            <input type="text" id="login-username" required>
            <i class="fas fa-user"></i>
            <label for="login-username">Username</label>
        </div>

        <div class="form-group">
            <input type="password" id="login-password" required>
            <i class="fas fa-lock"></i>
            <label for="login-password">Password</label>
        </div>

        <div class="forgot-pass">
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn" id="submit">Login</button>

        <div class="link">
            <p>Don't have an account? <a href="#" class="signup-link">Sign Up</a></p>
        </div>
    </form>
</div>

    </div>
    
</body>

</html>
